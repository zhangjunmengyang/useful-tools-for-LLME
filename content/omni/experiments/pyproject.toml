[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-omni-experiments"
version = "0.1.0"
description = "Executable mechanism experiments for the Learn Omni course"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
learn-omni = "learn_omni_experiments.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
