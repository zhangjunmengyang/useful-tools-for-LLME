[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-cl-experiments"
version = "0.1.0"
description = "Executable mechanism experiments for the Learn CL course"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.scripts]
learn-cl = "learn_cl_experiments.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
